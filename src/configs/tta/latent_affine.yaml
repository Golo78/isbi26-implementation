# Latent-space test-time adaptation via gradient ascent on the predicted score.
#
# Adaptation sites are indices into the `adn.N` module list (same indexing as
# model.swivels).  They are NOT the same as model.swivels: those three define what the
# prediction head *reads*, these define where the affine transform is *applied*.
#
# Measured on PMRI threet-to-onepointfivet (predictor cleanHalf_0, logits variant):
#   sites [-1]     -> d_mu +0.006, d_Dice -0.010   (logit recalibration: harmful)
#   sites [0]      -> d_mu +0.068, d_Dice +0.046
#   sites [0, 17]  -> d_mu +0.139, d_Dice +0.107   (best; turnover beyond step 60)
#   sites [0,17,-1]-> d_mu +0.071, d_Dice +0.056   (peaks at step ~40, then collapses)
adapt_sites: [0, 17]

# --- experiment switches (defaults reproduce the original mu-hat ascent) ---------------
# objective: what the ascent maximizes.
#   mu           -> predicted score mu-hat.  Label-free, deployable.
#   oracle-dice  -> the TRUE soft Dice (needs ground-truth labels!).  NOT deployable; it
#                   is the upper bound of what latent adaptation could reach with a
#                   perfect quality estimate, and the gap to `mu` is the price paid for
#                   the imperfect mu-hat / true-Dice correlation.
objective: mu

# placement: where the affine is applied relative to the swivel's InstanceNorm.
#   post -> on the norm OUTPUT (default; the affine survives and moves the segmentation)
#   pre  -> on the norm INPUT, prepended before the score-predictor's recording hook.
#           The QC head sees the adapted features, but the segmentation path sees
#           IN(gamma*x + beta) == IN(x), i.e. the affine annihilated.  Expected signature:
#           mu-hat moves while `logit drift` stays ~0.
placement: post

# kappa: simultaneous gradient DESCENT on the head's predictive uncertainty, added to the
# same objective (0 disables, i.e. score ascent only).
#   sigma      -> objective - kappa_weight * sqrt(mu(1-mu)/(kappa+1))
#   log-kappa  -> objective + kappa_weight * log(kappa)
kappa_weight: 0.0
kappa_objective: sigma

# size ORACLE: simultaneous descent on the error of the soft mask size against a target
# fixed before the adaptation (0 disables).  The target uses the TRUE FP/FN counts of the
# un-adapted mask (labels!), i.e. it simulates a head that predicts FP and FN once:
#   G_hat     = |P_0| - FP_0 * (1 + e_fp) + FN_0 * (1 + e_fn),   e ~ U(-size_noise, size_noise)
#   objective - size_weight * (log(1 + sum p) - log(1 + G_hat))^2
# size_noise = 0 -> G_hat is the true GT size.  size_noise_seed fixes the draws (per domain).
size_weight: 0.0
size_noise: 0.0
size_noise_seed: 0

# FP/FN ORACLE: simultaneous descent on the TRUE soft FP and FN counts of the CURRENT mask,
# recomputed at every step (labels!), anchored at 0 (0 disables):
#   objective - fpfn_weight * (log(1 + FP) + log(1 + FN)),  FP = sum p(1-g), FN = sum (1-p)g
# simulates a head that predicts FP and FN perfectly for every mask the adaptation produces.
fpfn_weight: 0.0
# separate: log(1 + FP) + log(1 + FN) (minimal as soon as FP = 0 OR FN = 0)
# joint:    log(1 + FP + FN)          (minimal only for a perfect mask)
fpfn_form: separate
# weight a on FN inside either form, e.g. log(1 + FP + a * FN) (> 1: missing pixels cost more)
fpfn_fn_weight: 1.0
# where FP and FN come from:
#   oracle -> true soft counts from the labels (above)
#   head   -> predicted by a trained FP/FN head (model/fpfn_head.py, train_fpfn_head.sh);
#             label-free.  Looked up in fpfn_head_dir by fpfn_head_name (null: fpfn_<k> for
#             ckpt_name cleanHalf_<k>), or given directly as fpfn_head_ckpt.
# A head named with source=oracle is only evaluated along the run (fp_pred / fn_pred).
fpfn_source: oracle
fpfn_head_dir: pre-trained/fpfn-heads
fpfn_head_name: null
fpfn_head_ckpt: null

# adapt_logits: additional per-channel affine on the UNet LOGITS (after the last layer),
# seen by both the segmentation and the QC head.  Combined with adapt_sites; set
# adapt_sites: [] for logits only.  For a 1-channel network this is, on the hard mask, a
# per-image threshold shift (-beta/gamma) -- compare with the threshold oracle below.
# logit_lr: separate Adam lr for the logit affine (null = lr).
adapt_logits: false
logit_lr: null

# threshold oracle (always computed, needs labels): per image, the logit threshold t from
# linspace(min, max, num) (plus 0) that maximizes the true hard Dice of `logits > t`.
# Step 0.1; +-8 was too narrow (optima hit the grid edge on 3T->1.5T).  Costs one Dice
# evaluation per candidate (~20 ms per batch of 8, i.e. ~6 s per batch at num=321).
threshold_oracle:
  min: -16.0
  max: 16.0
  num: 321

# qualitative examples per domain (evenly spaced over the domain) + plots/<...>.png
n_examples: 6
# explicit dataset indices to snapshot instead (null = evenly spaced); examples_only: adapt
# only the batches that contain them (re-running selected cases, e.g. failures)
example_indices: null
examples_only: false
plot: true

# optimizer for the latent parameters
lr: 0.01
max_steps: 1000  #20 # 100

# stopping rule: fixed-steps | delta-mu-target | fg-drift
#
# mu-hat and kappa-hat rise monotonically even after the true Dice starts falling, so
# they carry no stopping information.  Foreground-fraction drift is the most informative
# label-free signal observed so far.
stop_rule: fixed-steps
delta_mu_target: 0.10
fg_drift_tol: 0.15

# trust region (0 disables)
prox_weight: 0.0
max_log_gamma: 0.0
max_beta: 0.0

# 'batch'  -> reset and re-fit per batch (matches the reported numbers)
# 'domain' -> fit one shared parameter set on the whole target domain, then freeze
granularity: batch
domain_fit_batches: 8

# fp32 for the inner loop: the head divides its input by 1000, so d mu-hat / d gamma is
# ~1e-3 scaled and underflows in fp16.
precision: fp32
